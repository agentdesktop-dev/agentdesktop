# cargo-deny configuration. CI runs `cargo deny check` on every PR and push to main.
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true

[advisories]
# Fail on any RustSec vulnerability, plus unmaintained/unsound crates in our direct or
# transitive dependencies. Add targeted ignores below only for advisories with no fix,
# each with the advisory ID and a one-line reason.
unmaintained = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.37 via sqlx-sqlite 0.9.0 (latest), which caps it <0.38; we open only our own DB files. Drop once sqlx allows >=0.39." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; build-time only, via Tauri's gtk-rs 0.18 Linux stack, with no maintained alternative upstream." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (merged into zbus 6); via zbus 5 in the Linux keyring store, pending upstream move to zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained (merged into zbus 6); via zbus 5 in the Linux keyring store, pending upstream move to zbus 6." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained (merged into zbus 6); via zbus 5 in the Linux keyring store, pending upstream move to zbus 6." },
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is unmaintained; dev-dependency only, via testcontainers 0.28 in agent tests." },
]

[licenses]
# Keep this list to what the dependency tree actually needs today; adding a license
# here is a deliberate review decision.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are not published and carry no license field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
