{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentdesktop-controller.fullname" . }}
  labels:
    {{- include "agentdesktop-controller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentdesktop-controller.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Fleet gRPC API, gateway JWKS and usage ingest. No `from` admits any source.
  - ports:
    - port: fleet
      protocol: TCP
    {{- with $np.ingress.fleet.from }}
    from:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $np.ingress.admin.from }}
  - ports:
    - port: admin
      protocol: TCP
    from:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    {{- with $np.egress.dns.to }}
    to:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $np.egress.database }}
  {{- if .to }}
  - to:
      {{- toYaml .to | nindent 6 }}
    {{- with .ports }}
    ports:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- with $np.egress.idp }}
  {{- if .to }}
  - to:
      {{- toYaml .to | nindent 6 }}
    {{- with .ports }}
    ports:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- with $np.egress.extra }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
