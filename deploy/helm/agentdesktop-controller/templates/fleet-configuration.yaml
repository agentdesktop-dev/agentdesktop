{{- if and .Values.fleetConfiguration.enabled .Values.fleetConfiguration.create }}
{{- $name := include "agentdesktop-controller.fleetConfigurationName" . }}
{{- if not (lookup "v1" "ConfigMap" .Release.Namespace $name) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentdesktop-controller.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
data:
  revision: "1"
  daemon.yaml: |
{{ toYaml .Values.daemonConfig | indent 4 }}
{{- end }}
{{- end }}