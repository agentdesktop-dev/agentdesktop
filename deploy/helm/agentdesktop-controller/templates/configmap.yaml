{{- if and .Values.existingConfigSecret (or .Values.fleetConfiguration.enabled (not (empty .Values.daemonConfig))) }}
{{- fail "fleetConfiguration and daemonConfig values cannot be used with existingConfigSecret; configure daemonConfig in the Secret's controller.yaml" }}
{{- end }}
{{- if not .Values.existingConfigSecret }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentdesktop-controller.fullname" . }}
  labels:
    {{- include "agentdesktop-controller.labels" . | nindent 4 }}
data:
  controller.yaml: |
    fleetListen: 0.0.0.0:8443
    adminListen: 127.0.0.1:8080
    databaseUrl: {{ required "databaseUrl is required" .Values.databaseUrl | quote }}
    tls: /etc/agentdesktop/tls
    allowInsecureDev: {{ .Values.allowInsecureDev }}
    oidc:
      issuer: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}
      clientId: {{ required "oidc.clientId is required" .Values.oidc.clientId | quote }}
      redirectUri: {{ .Values.oidc.redirectUri | quote }}
    {{- with .Values.gatewayJwt }}
    gatewayJwt:
{{ toYaml . | indent 6 }}
    {{- end }}
    {{- if .Values.fleetConfiguration.enabled }}
    daemonConfig:
      database:
        seedRevision: {{ .Values.fleetConfiguration.seedRevision }}
        {{- with .Values.daemonConfig }}
        seedPath: /etc/agentdesktop/config/daemon.yaml
        {{- end }}
    {{- else }}
    {{- with .Values.daemonConfig }}
    daemonConfig:
      path: /etc/agentdesktop/config/daemon.yaml
    {{- end }}
    {{- end }}
  {{- with .Values.daemonConfig }}
  daemon.yaml: |
{{ toYaml . | indent 4 }}
  {{- end }}
{{- end }}
