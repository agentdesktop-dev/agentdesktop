{{- if not .Values.existingConfigSecret }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentdesktop-controller.fullname" . }}
  labels:
    {{- include "agentdesktop-controller.labels" . | nindent 4 }}
data:
  controller.yaml: |
    fleetListener:
      listen: 0.0.0.0:8443
      {{- with .Values.fleetListener.limits }}
      limits:
{{ toYaml . | indent 8 }}
      {{- end }}
    adminListener:
      listen: 127.0.0.1:8080
      {{- with .Values.adminListener.limits }}
      limits:
{{ toYaml . | indent 8 }}
      {{- end }}
    databaseUrl: {{ required "databaseUrl is required" .Values.databaseUrl | quote }}
    tls: /etc/agentdesktop/tls
    allowInsecureDev: {{ .Values.allowInsecureDev }}
    oidc:
      issuer: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}
      clientId: {{ required "oidc.clientId is required" .Values.oidc.clientId | quote }}
      redirectUri: {{ .Values.oidc.redirectUri | quote }}
    {{- with .Values.gatewayJwt }}
    gatewayJwt:
{{ toYaml . | indent 6 }}
    {{- end }}
    {{- if include "agentdesktop-controller.gatewayListenerEnabled" . }}
    gatewayListener:
      listen: 0.0.0.0:{{ .Values.gatewayListener.port }}
      tls: {{ .Values.gatewayListener.tls }}
      {{- with .Values.gatewayListener.limits }}
      limits:
{{ toYaml . | indent 8 }}
      {{- end }}
    {{- end }}
    {{- with .Values.daemonConfig }}
    daemonConfig:
      path: /etc/agentdesktop/config/daemon.yaml
    {{- end }}
  {{- with .Values.daemonConfig }}
  daemon.yaml: |
{{ toYaml . | indent 4 }}
  {{- end }}
{{- end }}
