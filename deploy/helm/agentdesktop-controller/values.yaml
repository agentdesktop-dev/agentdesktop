replicaCount: 1

image:
  repository: ghcr.io/agentdesktop-dev/agentdesktop-controller
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# This chart does not deploy PostgreSQL. Point this URL at an existing
# database. Prefer existingConfigSecret when the URL contains credentials.
databaseUrl: ""
oidc:
  issuer: https://id.example.com
  clientId: agentdesktop
  redirectUri: http://127.0.0.1:51327/callback
allowInsecureDev: false

# Optional short-lived JWT issuer for authenticated LLM gateways.
gatewayJwt: {}

# Daemon configuration document distributed to enrolled devices. Leave empty
# to disable managed configuration. With fleetConfiguration disabled this is
# the read-only distributed content; with it enabled this is only the initial
# seed and the UI owns the document afterwards.
daemonConfig: {}

# Where the daemonConfig document is stored: a dedicated ConfigMap that the
# controller watches and the management UI can update and roll out. When
# disabled, the document is distributed from a read-only file instead.
fleetConfiguration:
  enabled: false
  # The ConfigMap is seeded only when it does not already exist; Helm never
  # modifies it afterwards. Set false when an offline renderer such as
  # Argo CD would reapply the seed. Create it once outside that renderer
  # instead.
  create: true
  # Defaults to <release>-fleet-configuration when empty.
  name: ""

serviceAccount:
  create: true
  annotations: {}
  # Defaults to the release name when empty.
  name: ""

rbac:
  create: true

# When set, this Secret is mounted instead of the generated ConfigMap. It
# must contain a complete controller configuration at configSecretKey.
existingConfigSecret: ""
configSecretKey: controller.yaml

# Existing Secret containing controller.pem, controller-key.pem,
# device-ca.pem, and device-ca-key.pem.
tlsSecretName: agentdesktop-controller-tls

service:
  type: LoadBalancer
  port: 443

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
