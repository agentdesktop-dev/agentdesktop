replicaCount: 1

image:
  repository: ghcr.io/agentdesktop-dev/agentdesktop-controller
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# This chart does not deploy PostgreSQL. Point this URL at an existing
# database. Prefer existingConfigSecret when the URL contains credentials.
databaseUrl: ""
oidc:
  issuer: https://id.example.com
  clientId: agentdesktop
  redirectUri: http://127.0.0.1:51327/callback
allowInsecureDev: false

# Optional short-lived JWT issuer for authenticated LLM gateways.
gatewayJwt: {}

# Limits on the device-facing fleet API, such as connectionsPerAddress or
# maxMessageBytes. Unset fields keep the controller defaults; see
# schema/controller-config.md.
fleetLimits: {}

# Daemon configuration distributed to enrolled devices. Leave empty to
# disable managed configuration.
daemonConfig: {}

# When set, this Secret is mounted instead of the generated ConfigMap. It
# must contain a complete controller configuration at configSecretKey.
existingConfigSecret: ""
configSecretKey: controller.yaml

# Existing Secret containing controller.pem, controller-key.pem,
# device-ca.pem, and device-ca-key.pem.
tlsSecretName: agentdesktop-controller-tls

service:
  type: LoadBalancer
  port: 443
  # The controller limits connections and enrollment per client address. With
  # the Kubernetes default (Cluster), it may see node addresses instead of
  # devices' own, so many devices share one address's connection limit and
  # enrollment budget. Set Local to keep devices' addresses, if your load
  # balancer only sends traffic to nodes that run the controller (NodePort
  # clients must connect to such a node). Local does not help behind a load
  # balancer that proxies connections. Otherwise raise
  # fleetLimits.connectionsPerAddress, and for large rollouts raise
  # fleetLimits.enrollmentBurst or shorten fleetLimits.enrollmentRefill.
  # Applies only to LoadBalancer and NodePort services.
  externalTrafficPolicy: ""

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
