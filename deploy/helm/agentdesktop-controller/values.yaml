replicaCount: 1

image:
  repository: ghcr.io/agentdesktop-dev/agentdesktop-controller
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# This chart does not deploy PostgreSQL. Point this URL at an existing
# database. Prefer existingConfigSecret when the URL contains credentials.
databaseUrl: ""
oidc:
  issuer: https://id.example.com
  clientId: agentdesktop
  redirectUri: http://127.0.0.1:51327/callback
allowInsecureDev: false

# Optional short-lived JWT issuer for authenticated LLM gateways.
gatewayJwt: {}

# Daemon configuration document distributed to enrolled devices. In read-only
# file mode, leave this empty to disable managed configuration. In database
# mode, this is only the initial seed; empty initializes to `programs: {}`.
daemonConfig: {}

# Store daemonConfig in the controller database so the management UI can update
# and roll it out. When disabled, daemonConfig is read from a watched file and
# the UI is read-only.
fleetConfiguration:
  enabled: false
  # Used only when the database has no fleet configuration yet.
  seedRevision: 1

# When set, this Secret is mounted instead of the generated ConfigMap. It
# must contain a complete controller configuration at configSecretKey.
existingConfigSecret: ""
configSecretKey: controller.yaml

# Existing Secret containing controller.pem, controller-key.pem,
# device-ca.pem, and device-ca-key.pem.
tlsSecretName: agentdesktop-controller-tls

service:
  type: LoadBalancer
  port: 443

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
