services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: agentdesktop
      POSTGRES_PASSWORD: agentdesktop-development
      POSTGRES_USER: agentdesktop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdesktop -d agentdesktop"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: