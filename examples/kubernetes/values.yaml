databaseUrl: postgresql://agentdesktop:agentdesktop@postgres:5432/agentdesktop?sslmode=disable
oidc:
  issuer: http://dex.agentdesktop.svc.cluster.local:5556/dex
  clientId: agentdesktop-kubernetes
  redirectUri: http://127.0.0.1:51327/callback
allowInsecureDev: true
gatewayJwt:
  privateKey: /etc/agentdesktop/tls/gateway-jwt-key.pem
  issuer: agentdesktop-controller
  keyId: agentdesktop
  lifetime: 5m
llmGatewayUsageUrl: http://agentgateway-admin.agentgateway-system.svc.cluster.local:15000/api/logs/analytics/summary
daemonConfig:
  llmGateway:
    url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local
    authentication:
      type: controllerJwt
      audience: agentgateway
      allowedClientIds: [claude-code]
  programs:
    claudeCode:
      companyAnnouncements:
      - Managed by Agentdesktop
tlsSecretName: agentdesktop-controller-tls
