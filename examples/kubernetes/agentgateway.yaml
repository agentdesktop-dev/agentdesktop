apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - group: agentgateway.dev
        kind: AgentgatewayModel
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: anthropic
  namespace: agentgateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
    sectionName: http
  match:
    model: "*"
  provider: Anthropic
  policies:
    auth:
      secretRef:
        name: anthropic
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentdesktop-jwt
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: agentgateway-proxy
  frontend:
    accessLog:
      attributes:
        add:
        - name: llm.client
          expression: jwt.client_id
        - name: user
          expression: jwt.email
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
      - issuer: agentdesktop-controller
        audiences:
        - agentgateway
        jwks:
          remote:
            jwksPath: /.well-known/jwks.json
            backendRef:
              group: ""
              kind: Service
              name: agentdesktop
              namespace: agentdesktop
              port: 443
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentdesktop-controller-tls
  namespace: agentdesktop
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: agentdesktop
  backend:
    tls:
      caCertificateRefs:
      - name: agentdesktop-controller-ca
