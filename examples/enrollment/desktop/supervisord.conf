; The device daemon runs as root, as an installed system daemon does. The
; desktop user `dev` is in the `agentdesktop` group, which grants the desktop
; app access to the daemon's local API.

[program:daemon]
command=/usr/local/bin/agentdesktop daemon --config /demo/agentdesktop.yaml
user=root
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvnc]
command=/usr/bin/Xvnc :1 -geometry 1440x900 -depth 24 -SecurityTypes None -localhost -rfbport 5901 -nolisten tcp
user=dev
priority=20
autorestart=true
stdout_logfile=/var/log/supervisor/xvnc.log
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 0.0.0.0:6080 127.0.0.1:5901
user=dev
priority=30
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
redirect_stderr=true

[program:session]
command=/usr/local/bin/lab-session
user=dev
priority=40
autorestart=true
environment=HOME="/home/dev",USER="dev",DISPLAY=":1"
stdout_logfile=/var/log/supervisor/session.log
redirect_stderr=true
