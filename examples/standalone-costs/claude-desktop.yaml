# yaml-language-server: $schema=../../schema/daemon-config.json
llmGateway:
  url: http://127.0.0.1:4001
  usageUrl: http://127.0.0.1:15000/api/logs/analytics/summary
  authentication:
    type: oidc
    issuer: http://127.0.0.1:5557/dex
    clientId: agentdesktop-local
    scopes: [openid, email, offline_access]
    allowInsecure: true

programs:
  claudeDesktop:
    useLlmGateway: true