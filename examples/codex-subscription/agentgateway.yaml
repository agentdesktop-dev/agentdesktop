# yaml-language-server: $schema=https://raw.githubusercontent.com/agentgateway/agentgateway/v1.6.0/schema/config.json

frontendPolicies:
  accessLog:
    add:
      agentdesktop.billing: '"subscription"'

llm:
  port: 4002
  policies:
    jwtAuth:
      mode: strict
      location:
        expression: |
          request.headers["authorization"].with(credential,
            credential.matches("^Bearer agentdesktop:[^: ]+:[^: ]+:[^: ]+$")
              ? credential.split(":")[2] : "")
      issuer: http://127.0.0.1:5558/dex
      audiences: [agentdesktop-local]
      jwks:
        url: http://dex:5558/dex/keys
    transformations:
      request:
        replace: |
          request.headers["authorization"].split(" ")[1].split(":").with(parts,
            request.headers.merge({
              "authorization": "Bearer " + parts[1],
              "chatgpt-account-id": parts[3]
            }))
  models:
  - name: "*"
    provider: openai
    params:
      baseUrl: https://chatgpt.com/backend-api/codex
