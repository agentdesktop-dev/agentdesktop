# yaml-language-server: $schema=../../schema/controller-config.json
fleetListener:
  listen: 0.0.0.0:8443
adminListener:
  listen: 127.0.0.1:8080
allowInsecureDev: true
databaseUrl: sqlite:///state/controller.db?mode=rwc
tls: /keys

# Required by the controller, but unused here: the device enrolls with a token.
oidc:
  issuer: http://dex:5556/dex
  clientId: agentdesktop-lab

enrollmentTokens:
  audience: agentdesktop-lab
  issuers:
  - name: lab
    publicKeyPath: /keys/enrollment-issuer.pub.pem

# lab.sh replaces this file. The controller pushes each valid change to the
# device.
daemonConfig:
  path: /policy/policy.yaml
