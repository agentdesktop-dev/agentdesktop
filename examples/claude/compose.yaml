services:
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: dex serve /etc/dex/config.yaml
    ports:
    - 127.0.0.1:5556:5556
    volumes:
    - ./dex.yaml:/etc/dex/config.yaml:ro

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.6.0
    command: -f /etc/agentgateway/config.yaml
    network_mode: host
    environment:
      ANTHROPIC_API_KEY:
      AGENTDESKTOP_USAGE_TOKEN:
    volumes:
    - ./agentgateway.yaml:/etc/agentgateway/config.yaml:ro
    - /tmp/agentdesktop-keys/device-ca.pem:/etc/agentgateway/controller-ca.pem:ro
