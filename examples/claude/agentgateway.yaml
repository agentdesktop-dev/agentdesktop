# yaml-language-server: $schema=https://agentgateway.dev/schema/config
frontendPolicies:
  accessLog:
    add:
      llm.client: jwt.client_id
      user: jwt.email
    # Token and cost usage for the controller (`usage` in controller.yaml).
    otlp:
      host: https://127.0.0.1:8443
      policies:
        backendTLS:
          root: /etc/agentgateway/controller-ca.pem
        backendAuth:
          key:
            value: $AGENTDESKTOP_USAGE_TOKEN
      fields:
        add:
          agentdesktop.subject: jwt.sub
          agentdesktop.device: jwt.act.sub
          agentdesktop.client: jwt.client_id
          agentdesktop.billing: >-
            request.headers["authorization"].startsWith("Bearer agentdesktop:")
              ? "subscription"
              : "api"
gateways:
  gateway:
    port: 4000
routes:
- name: claude-desktop-reachability
  gateways: gateway
  matches:
  - method: HEAD
    path:
      exact: /
  policies:
    directResponse:
      status: 200
llm:
  gateways: gateway
  policies:
    jwtAuth:
      mode: strict
      issuer: agentdesktop-controller
      audiences: [agentgateway]
      jwks:
        url: http://127.0.0.1:8080/.well-known/jwks.json
  models:
  - name: "*"
    provider: anthropic
    params:
      apiKey: $ANTHROPIC_API_KEY
  - name: "claude-haiku-4-5"
    provider: anthropic
    params:
      apiKey: $ANTHROPIC_API_KEY
