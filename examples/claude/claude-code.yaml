# yaml-language-server: $schema=../../schema/daemon-config.json
llmGateway:
  url: http://localhost:4000
  authentication:
    type: controllerJwt
    audience: "agentgateway"
    allowedClientIds: [claude-code, claude-desktop, codex, opencode, pi]

telemetry:
  events:
  - session.new
  - tool.use

programs:
  claudeCode:
    companyAnnouncements: ["Managed by Agentdesktop"]
  claudeDesktop:
    isLocalDevMcpEnabled: true
  # Pi requires --user. Remove claudeDesktop before enabling Pi in user mode.
  # pi:
  #   useLlmGateway: true
  #   model: claude-sonnet-4-5
