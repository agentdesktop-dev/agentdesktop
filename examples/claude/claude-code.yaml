inferenceGateway:
  url: http://localhost:4000
  authentication:
    type: controllerJwt
    audience: "agentgateway"

telemetry:
  events:
  - session.new
  - tool.use

programs:
  claudeCode:
    companyAnnouncements: ["Managed by AgentDesktop"]
  claudeDesktop:
    isLocalDevMcpEnabled: true
