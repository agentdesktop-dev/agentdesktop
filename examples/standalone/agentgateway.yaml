# yaml-language-server: $schema=https://agentgateway.dev/schema/config
frontendPolicies:
  accessLog:
    add:
      oauth.client: jwt.aud
      user: jwt.email
    # Token and cost usage for the desktop app (`daemon.usage` in config.yaml).
    otlp:
      host: http://127.0.0.1:4319
      policies:
        backendAuth:
          key:
            value: $AGENTDESKTOP_USAGE_TOKEN
      fields:
        add:
          # Names the tool (Claude Code, Codex) behind each request.
          user_agent.original: request.headers["user-agent"]

gateways:
  gateway:
    port: 4001
    bindAddress: 127.0.0.1

routes:
- name: reachability
  gateways: gateway
  matches:
  - method: HEAD
    path:
      exact: /
  policies:
    directResponse:
      status: 200

llm:
  gateways: gateway
  policies:
    jwtAuth:
      mode: strict
      issuer: http://127.0.0.1:5557/dex
      audiences: [agentdesktop-local]
      jwks:
        url: http://127.0.0.1:5557/dex/keys
  models:
  # Claude desktop requires an explicit model
  - name: "claude-haiku-4-5"
    provider: anthropic
    params:
      apiKey: $ANTHROPIC_API_KEY
  - name: "claude-sonnet-4-5"
    provider: anthropic
    params:
      apiKey: $ANTHROPIC_API_KEY
  # Claude code will not query our models and is fine with passthrough
  - name: "*"
    provider: anthropic
    params:
      apiKey: $ANTHROPIC_API_KEY
