# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  readinessAddr: 0.0.0.0:15021

llm:
  port: 8443
  tls:
    cert: certs/gateway-server.crt
    key: certs/gateway-server.key
    root: certs/enrollment-ca.crt
  policies:
    jwtAuth:
      mode: strict
      location:
        header:
          name: x-agentdesktop-authorization
          prefix: 'Bearer '
      issuer: $OIDC_ISSUER
      audiences: [$OIDC_AUDIENCE]
      jwks:
        url: $OIDC_JWKS_URL
      jwtValidationOptions:
        requiredClaims: [exp, aud, iss, sub]
  models:
  - name: '*'
    provider: anthropic
    params:
      apiKey: $ANTHROPIC_API_KEY
      baseUrl: $ANTHROPIC_BASE_URL