[package]
name = "agentdesktop-ui"
description = "Cross-platform desktop and tray client for AgentDesktop."
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
agentdesktop-client.workspace = true
agentdesktop-core.workspace = true
open.workspace = true
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["time"] }
