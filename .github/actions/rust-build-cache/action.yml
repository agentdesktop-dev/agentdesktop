name: Rust build cache
description: Set up Rust and restore source-aware build artifacts

inputs:
  cache-key:
    description: Cache namespace shared by equivalent jobs
    required: true
  save:
    description: Save the cache after a successful job
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
      with:
        toolchain: "1.98"
        components: clippy,rustfmt

    # Cargo relies heavily on mtimes. Restoring source mtimes allows cached
    # workspace artifacts to remain valid on a fresh checkout.
    - name: Restore source mtimes
      shell: bash
      run: |
        curl --fail --silent --show-error --location \
          https://raw.githubusercontent.com/howardjohn/git-restore-mtime-action/b77092831982028ae46f86c64831e6e0dde7ee8f/git-restore-mtime |
          python3 - --commit-time

    - name: Restore Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}
        cache-workspace-crates: true
        save-if: ${{ inputs.save }}
