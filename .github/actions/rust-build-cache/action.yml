name: Rust build cache
description: Set up Rust and restore cached dependency builds

inputs:
  cache-key:
    description: Cache namespace shared by equivalent jobs
    required: true
  save:
    description: Save the cache after a successful job
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
      with:
        toolchain: "1.98"
        components: clippy,rustfmt

    - name: Restore Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}
        # Cargo judges workspace crates by mtime, so cached builds can mask source changes.
        cache-workspace-crates: false
        save-if: ${{ inputs.save }}
