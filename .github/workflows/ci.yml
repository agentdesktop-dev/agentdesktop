name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref_name) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  check:
    name: Test and lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install UI dependencies
        working-directory: frontend
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          cache-key: ci
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: nextest

      # Build once before Cargo, which embeds the frontend assets.
      - name: Build UI
        working-directory: frontend
        run: pnpm build

      - name: Test Rust
        run: cargo nextest run --workspace

      - name: Lint Rust
        run: make lint

      - name: Lint UI and test packaging
        working-directory: frontend
        run: pnpm check:lint

      - name: Test UI in Chrome
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: |
          google-chrome --version
          pnpm test:storybook

      - name: Check generated schemas
        run: |
          make generate-schema
          git diff --exit-code -- schema

  windows:
    name: Windows agent tests
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-windows
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: nextest

      - name: Test agent
        run: cargo nextest run --locked --package agentdesktop-agent --lib

  container:
    name: Container
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build controller image
        run: make docker BUILD_PROFILE=debug
