name: Release macOS

on:
  workflow_call:
    inputs:
      version:
        description: Canonical release version without a v prefix
        required: true
        type: string
    secrets:
      APPLE_APPLICATION_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  build-macos-binaries:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      AGENTDESKTOP_VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-apple-darwin
            runner: macos-15-intel
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm --filter @agentdesktop/desktop-web build

      - name: Build binary
        shell: bash
        run: cargo build --locked --release --package agentdesktop --target "${{ matrix.target }}"

      - name: Import macOS signing identity
        shell: bash
        env:
          APPLE_APPLICATION_CERTIFICATE: ${{ secrets.APPLE_APPLICATION_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/import-macos-signing.sh

      - name: Sign macOS binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/${TARGET}/release/agentdesktop"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
            --identifier dev.agentdesktop.tray --options runtime --timestamp=none "$binary"
          codesign --verify --strict --verbose=2 \
            -R="identifier \"dev.agentdesktop.tray\" and certificate leaf = H\"${APPLE_SIGNING_IDENTITY}\"" "$binary"

      - name: Stage binary and checksum
        shell: bash
        env:
          OUTPUT_NAME: agentdesktop-darwin-${{ matrix.arch }}
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/agentdesktop" "release/${OUTPUT_NAME}"
          (cd release && shasum -a 256 "${OUTPUT_NAME}" > "${OUTPUT_NAME}.sha256")

      - name: Remove macOS signing identity
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          # remove-trusted-cert can hang on headless macOS runners:
          # https://github.com/actions/runner-images/issues/12116
          # Leave public trust metadata to disposable GitHub-hosted VM teardown.
          # Delete exported files first, even if keychain deletion later fails.
          rm -f "${RUNNER_TEMP}/agentdesktop-signing.pem" "${RUNNER_TEMP}/agentdesktop-signing.p12"
          if [ -f "${RUNNER_TEMP}/agentdesktop-signing.keychain-db" ]; then
            security delete-keychain "${RUNNER_TEMP}/agentdesktop-signing.keychain-db"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-darwin-${{ matrix.arch }}
          path: release/agentdesktop-*
          if-no-files-found: error

  build-macos-installers:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-apple-darwin
            runner: macos-15-intel
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-26
    env:
      AGENTDESKTOP_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile

      - name: Import macOS signing identity
        shell: bash
        env:
          APPLE_APPLICATION_CERTIFICATE: ${{ secrets.APPLE_APPLICATION_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/import-macos-signing.sh

      - name: Build PKG
        working-directory: frontend
        shell: bash
        run: pnpm --filter @agentdesktop/desktop-web dist:mac -- --target "${{ matrix.target }}"

      - name: Verify application signature
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          app="target/${TARGET}/release/bundle/macos/agentdesktop.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict \
            -R="identifier \"dev.agentdesktop.tray\" and certificate leaf = H\"${APPLE_SIGNING_IDENTITY}\"" \
            "$app/Contents/MacOS/agentdesktop"

      - name: Stage PKG
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          OUTPUT_NAME: agentdesktop-macos-${{ matrix.arch }}.pkg
        run: |
          source_path="target/${TARGET}/release/bundle/pkg/Agent Desktop_${AGENTDESKTOP_VERSION}_${ARCH}.pkg"
          test -f "${source_path}"
          mkdir -p release
          cp "${source_path}" "release/${OUTPUT_NAME}"

      # Production notarization placeholder: notarize and staple the signed
      # package here, before calculating its checksum or smoke-testing it.
      # - name: Notarize and staple PKG
      #   shell: bash
      #   env:
      #     OUTPUT_NAME: agentdesktop-macos-${{ matrix.arch }}.pkg
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     xcrun notarytool submit "release/${OUTPUT_NAME}" \
      #       --apple-id "${APPLE_ID}" \
      #       --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
      #       --team-id "${APPLE_TEAM_ID}" \
      #       --wait
      #     xcrun stapler staple "release/${OUTPUT_NAME}"

      - name: Checksum PKG
        shell: bash
        env:
          OUTPUT_NAME: agentdesktop-macos-${{ matrix.arch }}.pkg
        run: |
          (cd release && shasum -a 256 "${OUTPUT_NAME}" > "${OUTPUT_NAME}.sha256")

      - name: Smoke test PKG install and replacement
        shell: bash
        env:
          OUTPUT_NAME: agentdesktop-macos-${{ matrix.arch }}.pkg
        run: |
          wait_for_daemon() {
            deadline=$((SECONDS + 30))
            until sudo "/Applications/agentdesktop.app/Contents/MacOS/agentdesktop" status; do
              if (( SECONDS >= deadline )); then
                echo "Installed CLI could not reach the Agent Desktop daemon" >&2
                return 1
              fi
              sleep 1
            done
          }

          daemon_pid() {
            sudo launchctl print system/dev.agentdesktop.daemon |
              awk '$1 == "pid" && $2 == "=" { print $3; exit }'
          }

          sudo installer -pkg "release/${OUTPUT_NAME}" -target /
          sudo launchctl print system/dev.agentdesktop.daemon > /dev/null
          wait_for_daemon

          first_pid="$(daemon_pid)"
          test -n "${first_pid}"
          config_hash="$(sudo shasum -a 256 /etc/agentdesktop/config.yaml | awk '{ print $1 }')"
          sudo touch /var/lib/agentdesktop/upgrade-smoke-marker

          sudo installer -pkg "release/${OUTPUT_NAME}" -target /
          sudo launchctl print system/dev.agentdesktop.daemon > /dev/null
          wait_for_daemon

          second_pid="$(daemon_pid)"
          test -n "${second_pid}"
          if [ "${first_pid}" = "${second_pid}" ]; then
            echo "Agent Desktop daemon was not restarted during package replacement" >&2
            exit 1
          fi
          test "${config_hash}" = "$(sudo shasum -a 256 /etc/agentdesktop/config.yaml | awk '{ print $1 }')"
          sudo test -f /var/lib/agentdesktop/upgrade-smoke-marker

      - name: Remove smoke-test installation
        if: always()
        shell: bash
        run: |
          sudo launchctl bootout system/dev.agentdesktop.daemon || true
          sudo rm -f /Library/LaunchDaemons/dev.agentdesktop.daemon.plist
          sudo rm -rf "/Applications/agentdesktop.app"
          sudo rm -rf /etc/agentdesktop /var/lib/agentdesktop /var/run/agentdesktop
          sudo rm -f /var/run/agentdesktop-relaunch
          sudo pkgutil --forget dev.agentdesktop.installer || true

      - name: Remove macOS signing identity
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          # remove-trusted-cert can hang on headless macOS runners:
          # https://github.com/actions/runner-images/issues/12116
          # Leave public trust metadata to disposable GitHub-hosted VM teardown.
          # Delete exported files first, even if keychain deletion later fails.
          rm -f "${RUNNER_TEMP}/agentdesktop-signing.pem" "${RUNNER_TEMP}/agentdesktop-signing.p12"
          if [ -f "${RUNNER_TEMP}/agentdesktop-signing.keychain-db" ]; then
            security delete-keychain "${RUNNER_TEMP}/agentdesktop-signing.keychain-db"
          fi

      - name: Upload PKG (self-signed application)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-installer-${{ matrix.arch }}
          path: release/agentdesktop-macos-*
          if-no-files-found: error
