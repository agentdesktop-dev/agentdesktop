name: Release Linux

on:
  workflow_call:
    inputs:
      version:
        description: Canonical release version without a v prefix
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CI: true
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/agentdesktop-controller
  CHART_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  build-controller-image:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform name
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.CONTROLLER_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=controller-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=controller-${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-digest-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push-controller-image:
    needs: build-controller-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: controller-digest-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tags=(-t "${CONTROLLER_IMAGE}:v${VERSION}")
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tags+=(-t "${CONTROLLER_IMAGE}:latest")
          fi
          images=()
          for digest in *; do
            images+=("${CONTROLLER_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign versioned image
        env:
          VERSION: ${{ inputs.version }}
        run: cosign sign --yes "${CONTROLLER_IMAGE}:v${VERSION}"

      - name: Sign latest image
        if: github.event_name == 'push'
        run: cosign sign --yes "${CONTROLLER_IMAGE}:latest"

  push-helm-chart:
    needs: push-controller-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "${{ runner.temp }}/charts"
          helm package deploy/helm/agentdesktop-controller \
            --version "${VERSION}" \
            --app-version "v${VERSION}" \
            --destination "${{ runner.temp }}/charts"
          helm push \
            "${{ runner.temp }}/charts/agentdesktop-controller-${VERSION}.tgz" \
            "oci://${CHART_REGISTRY}"

  build-linux-binaries:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      AGENTDESKTOP_VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm --filter @agentdesktop/desktop-web build

      - name: Build binary
        shell: bash
        run: cargo build --locked --release --package agentdesktop --target "${{ matrix.target }}"

      - name: Stage binary and checksum
        shell: bash
        env:
          OUTPUT_NAME: agentdesktop-linux-${{ matrix.arch }}
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/agentdesktop" "release/${OUTPUT_NAME}"
          (cd release && sha256sum "${OUTPUT_NAME}" > "${OUTPUT_NAME}.sha256")

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary-linux-${{ matrix.arch }}
          path: release/agentdesktop-*
          if-no-files-found: error

  # The daemon and CLI without the Tauri UI, statically linked against musl so
  # it runs on any Linux, including RHEL 8 and other hosts without GTK/WebKit
  # 4.1 or a recent glibc.
  build-linux-headless-binaries:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      AGENTDESKTOP_VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install musl toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}

      - name: Build binary
        shell: bash
        run: cargo build --locked --release --package agentdesktop-agent --bin agentdesktop-headless --target "${{ matrix.target }}"

      - name: Verify static linking
        shell: bash
        run: .github/scripts/verify-static-binary.sh "target/${{ matrix.target }}/release/agentdesktop-headless"

      - name: Stage binary and checksum
        shell: bash
        env:
          OUTPUT_NAME: agentdesktop-headless-linux-${{ matrix.arch }}
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/agentdesktop-headless" "release/${OUTPUT_NAME}"
          (cd release && sha256sum "${OUTPUT_NAME}" > "${OUTPUT_NAME}.sha256")

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary-linux-headless-${{ matrix.arch }}
          path: release/agentdesktop-*
          if-no-files-found: error

  attest-linux-binaries:
    needs:
      - build-linux-binaries
      - build-linux-headless-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          pattern: release-binary-linux-*
          merge-multiple: true

      - name: Attest Linux binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/agentdesktop-linux-amd64
            release/agentdesktop-linux-arm64
            release/agentdesktop-headless-linux-amd64
            release/agentdesktop-headless-linux-arm64
