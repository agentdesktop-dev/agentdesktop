[package]
name = "agentdesktop-controller"
description = "Central fleet controller for enrollment, inventory, and daemon configuration."
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
agentdesktop-core.workspace = true
agentdesktop-proto.workspace = true
agentdesktop-usage.workspace = true
anyhow.workspace = true
async-trait = "0.1"
aws-lc-rs.workspace = true
axum.workspace = true
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"] }
base64.workspace = true
clap.workspace = true
futures-core.workspace = true
http-body.workspace = true
jsonwebtoken.workspace = true
mime_guess = "2"
notify.workspace = true
notify-debouncer-full.workspace = true
pem-rfc7468.workspace = true
rand.workspace = true
rcgen.workspace = true
reqwest.workspace = true
rust-embed = "8"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "tls-rustls-aws-lc-rs"] }
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower-layer.workspace = true
tracing.workspace = true
time.workspace = true
url.workspace = true
uuid.workspace = true
x509-parser.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util.workspace = true
