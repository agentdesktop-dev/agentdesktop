[package]
name = "agentdesktop-agent"
description = "Device daemon for discovery, reconciliation, and fleet connectivity."
version.workspace = true
edition.workspace = true
publish.workspace = true
autobins = false
autotests = false

[[bin]]
name = "agentdesktop-headless"
path = "src/bin/agentdesktop-headless.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bin]]
name = "agentdesktop-service"
path = "src/bin/agentdesktop-service.rs"

[dependencies]
async-trait = "0.1"
agentdesktop-client.workspace = true
agentdesktop-core.workspace = true
agentdesktop-proto.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
hostname.workspace = true
hyper.workspace = true
hyper-util.workspace = true
json5.workspace = true
memchr.workspace = true
open.workspace = true
rand.workspace = true
rcgen.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
similar.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
toml.workspace = true
url.workspace = true

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
testcontainers = "0.28"
tracing-subscriber.workspace = true
# `start_paused` keeps the interval-driven inventory tests deterministic.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true
keyring-core.workspace = true
plist = "1.10"

[target.'cfg(windows)'.dependencies]
keyring.workspace = true
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Authorization",
] }
