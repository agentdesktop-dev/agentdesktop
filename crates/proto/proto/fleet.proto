syntax = "proto3";

package agentdesktop.fleet.v1;

service FleetAgent {
  rpc BeginEnrollment(BeginEnrollmentRequest) returns (BeginEnrollmentResponse);
  rpc CompleteEnrollment(CompleteEnrollmentRequest) returns (EnrollResponse);
  rpc RenewDeviceCertificate(RenewDeviceCertificateRequest) returns (DeviceCertificateResponse);
  rpc GetInferenceGatewayCredential(InferenceGatewayCredentialRequest) returns (InferenceGatewayCredentialResponse);
  rpc Connect(stream AgentMessage) returns (stream ControllerMessage);
}

message EnrollResponse {
  string device_id = 1;
  bytes client_certificate_pem = 2;
  uint64 client_certificate_expires_at_unix_seconds = 3;
}

message BeginEnrollmentRequest {
  string hostname = 1;
  string code_challenge = 2;
}

message BeginEnrollmentResponse {
  string enrollment_id = 1;
  string authorization_url = 2;
  string state = 3;
  string redirect_uri = 4;
  string token_endpoint = 5;
  string client_id = 6;
}

message CompleteEnrollmentRequest {
  string enrollment_id = 1;
  // Deprecated: the daemon exchanges the authorization code directly.
  string authorization_code = 2;
  // Deprecated: the PKCE verifier is sent only to the identity provider.
  string code_verifier = 3;
  bytes certificate_signing_request_der = 4;
  string id_token = 5;
}

message RenewDeviceCertificateRequest {
  bytes certificate_signing_request_der = 1;
}

message DeviceCertificateResponse {
  bytes client_certificate_pem = 1;
  uint64 expires_at_unix_seconds = 2;
}

message InferenceGatewayCredentialRequest {
  reserved 1;
  string client_id = 2;
}

message InferenceGatewayCredentialResponse {
  string credential = 1;
  uint64 expires_at_unix_seconds = 2;
}

message AgentMessage {
  oneof message {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    Inventory inventory = 3;
    ConfigStatus config_status = 4;
    TelemetryEvent telemetry = 5;
  }
}

// A timestamped telemetry observation reported by an enrolled device.
message TelemetryEvent {
  uint64 timestamp_unix_ms = 1;

  oneof event {
    ToolUseEvent tool_use = 2;
    SessionNewEvent session_new = 3;
  }
}

// A developer-tool session observed when it starts.
message SessionNewEvent {
  string client_id = 1;
  string session_id = 2;
}

// A developer tool invocation observed through a managed tool hook.
message ToolUseEvent {
  string client_id = 1;
  string tool_name = 2;
  string tool_use_id = 3;
  bytes input_json = 4;
}

message ControllerMessage {
  oneof message {
    DaemonConfig daemon_config = 1;
  }
}

message Hello {
  string device_id = 1;
  string hostname = 2;
  string os = 3;
  string architecture = 4;
  string agent_version = 5;
}

message Heartbeat {
  uint64 unix_time_seconds = 1;
}

message Inventory {
  repeated Discovery discoveries = 1;
}

message Discovery {
  string kind = 1;
  string version = 2;
  string path = 3;
  repeated McpServer mcp_servers = 4;
  repeated Skill skills = 5;
}

message McpServer {
  string name = 1;
  string transport = 2;
  string command = 3;
  string url = 4;
  bool enabled = 5;
  string source = 6;
}

message Skill {
  string path = 1;
  bytes front_matter_json = 2;
}

message DaemonConfig {
  uint64 revision = 1;
  bytes yaml = 2;
  bytes sha256 = 3;
}

message ConfigStatus {
  uint64 revision = 1;
  ConfigState state = 2;
  string error = 3;
}

enum ConfigState {
  CONFIG_STATE_UNSPECIFIED = 0;
  CONFIG_STATE_APPLIED = 1;
  CONFIG_STATE_FAILED = 2;
}
