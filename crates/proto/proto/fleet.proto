syntax = "proto3";

package agentdesktop.fleet.v1;

service FleetAgent {
  rpc BeginEnrollment(BeginEnrollmentRequest) returns (BeginEnrollmentResponse);
  rpc CompleteEnrollment(CompleteEnrollmentRequest) returns (EnrollResponse);
  rpc RenewDeviceCertificate(RenewDeviceCertificateRequest) returns (DeviceCertificateResponse);
  rpc GetLlmGatewayCredential(LlmGatewayCredentialRequest) returns (LlmGatewayCredentialResponse);
  rpc GetDeviceUsage(DeviceUsageRequest) returns (DeviceUsageResponse);
  rpc Connect(stream AgentMessage) returns (stream ControllerMessage);
}

message EnrollResponse {
  string device_id = 1;
  bytes client_certificate_pem = 2;
  uint64 client_certificate_expires_at_unix_seconds = 3;
}

message BeginEnrollmentRequest {
  string hostname = 1;
  string code_challenge = 2;
  // Use the OAuth 2.0 Device Authorization Grant (RFC 8628) instead of a
  // browser redirect, for hosts without a local browser. code_challenge is
  // ignored when set.
  bool device_authorization = 3;
}

message BeginEnrollmentResponse {
  string enrollment_id = 1;
  string authorization_url = 2;
  string state = 3;
  string redirect_uri = 4;
  string token_endpoint = 5;
  string client_id = 6;
  // Set only for device authorization enrollments.
  string device_code = 7;
  string user_code = 8;
  string verification_uri = 9;
  string verification_uri_complete = 10;
  uint64 interval_seconds = 11;
  uint64 expires_in_seconds = 12;
}

message CompleteEnrollmentRequest {
  string enrollment_id = 1;
  // Deprecated: the daemon exchanges the authorization code directly.
  string authorization_code = 2;
  // Deprecated: the PKCE verifier is sent only to the identity provider.
  string code_verifier = 3;
  bytes certificate_signing_request_der = 4;
  string id_token = 5;
}

message RenewDeviceCertificateRequest {
  bytes certificate_signing_request_der = 1;
}

message DeviceCertificateResponse {
  bytes client_certificate_pem = 1;
  uint64 expires_at_unix_seconds = 2;
}

message LlmGatewayCredentialRequest {
  reserved 1;
  string client_id = 2;
  // The daemon sends the credential together with a subscription token, so
  // the gateway bills the request to the subscription. The controller marks
  // the credential so usage records can report it apart from API spend.
  bool subscription = 3;
}

message LlmGatewayCredentialResponse {
  string credential = 1;
  uint64 expires_at_unix_seconds = 2;
}

// Usage for the calling device. The controller takes the device from the
// authenticated client certificate; a request cannot name another device.
message DeviceUsageRequest {
  // One of "24h", "7d", or "30d".
  string range = 1;
  // Daily buckets start at local midnight for this offset from UTC.
  sint32 utc_offset_minutes = 2;
}

message UsageTotals {
  uint64 requests = 1;
  uint64 errors = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  uint64 cache_read_tokens = 5;
  uint64 cache_write_tokens = 6;
  // API-billed cost in billionths of a US dollar at gateway catalog prices.
  int64 cost_nanos = 7;
  // Subscription-billed requests priced at API rates. Not part of cost_nanos.
  int64 subscription_cost_nanos = 8;
  uint64 subscription_requests = 9;
  // Requests for models the gateway has no price for.
  uint64 unpriced_requests = 10;
}

message UsageGroup {
  string key = 1;
  UsageTotals totals = 2;
}

message UsageBucket {
  uint64 start_unix_seconds = 1;
  UsageTotals totals = 2;
}

message DeviceUsageResponse {
  // False when the controller does not collect usage.
  bool enabled = 1;
  uint64 from_unix_seconds = 2;
  uint64 to_unix_seconds = 3;
  uint64 bucket_seconds = 4;
  UsageTotals totals = 5;
  repeated UsageBucket buckets = 6;
  repeated UsageGroup by_tool = 7;
  repeated UsageGroup by_model = 8;
}

message AgentMessage {
  oneof message {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    Inventory inventory = 3;
    ConfigStatus config_status = 4;
    TelemetryEvent telemetry = 5;
  }
}

// A timestamped telemetry observation reported by an enrolled device.
message TelemetryEvent {
  uint64 timestamp_unix_ms = 1;

  oneof event {
    ToolUseEvent tool_use = 2;
    SessionNewEvent session_new = 3;
  }
}

// A developer-tool session observed when it starts.
message SessionNewEvent {
  string client_id = 1;
  string session_id = 2;
}

// A developer tool invocation observed through a managed tool hook.
message ToolUseEvent {
  string client_id = 1;
  string tool_name = 2;
  string tool_use_id = 3;
  bytes input_json = 4;
}

message ControllerMessage {
  oneof message {
    DaemonConfig daemon_config = 1;
  }
}

message Hello {
  string device_id = 1;
  string hostname = 2;
  string os = 3;
  string architecture = 4;
  string agent_version = 5;
}

message Heartbeat {
  uint64 unix_time_seconds = 1;
}

message Inventory {
  repeated Discovery discoveries = 1;
  repeated ModelRuntime model_runtimes = 2;
  // The PAC browser policy sets, one entry per browser that is installed or
  // has policy. Absent from older agents.
  repeated BrowserPac browser_pacs = 3;
  // One fetch per distinct PAC URL in browser_pacs: the PAC's identity on
  // this device (SHA-256 of the body), never its content.
  repeated PacFetch pac_fetches = 4;
}

message PacFetch {
  string url = 1;
  // Lowercase hex SHA-256 of the body; empty when the fetch failed.
  string sha256 = 2;
  uint64 size = 3;
  // Why the fetch failed, at most 1024 bytes; empty on success.
  string error = 4;
}

message BrowserPac {
  // chrome | edge | chromium | firefox
  string browser = 1;
  // system | snap | flatpak, or empty when only policy was found.
  string packaging = 2;
  // Empty when policy sets no PAC.
  string pac_url = 3;
  // The value came from a user-overridable (recommended) policy location.
  bool recommended = 4;
  // Firefox Proxy.Locked.
  bool locked = 5;
  // The policy file the value came from.
  string source = 6;
  // A read error or conflicting policy files, at most 1024 bytes.
  string detail = 7;
}

message ModelRuntime {
  string kind = 1;
  repeated LocalModel models = 2;
}

message LocalModel {
  string name = 1;
}

message Discovery {
  string kind = 1;
  string version = 2;
  string path = 3;
  repeated McpServer mcp_servers = 4;
  repeated Skill skills = 5;
}

message McpServer {
  string name = 1;
  string transport = 2;
  string command = 3;
  string url = 4;
  bool enabled = 5;
  string source = 6;
}

message Skill {
  string path = 1;
  bytes front_matter_json = 2;
}

message DaemonConfig {
  uint64 revision = 1;
  bytes yaml = 2;
  bytes sha256 = 3;
}

message ConfigStatus {
  uint64 revision = 1;
  ConfigState state = 2;
  string error = 3;
  // Per-program outcomes of this apply, in the agent's provider order. Empty
  // when the configuration was not applied at all (hash or parse error), and
  // from agents that do not report per-program status: `programs_reported`
  // distinguishes the two.
  repeated ProgramStatus programs = 4;
  // Whether this agent version reports per-program status at all. An older
  // agent never sets this field, so it reads back as `false`.
  bool programs_reported = 5;
}

enum ConfigState {
  CONFIG_STATE_UNSPECIFIED = 0;
  CONFIG_STATE_APPLIED = 1;
  CONFIG_STATE_FAILED = 2;
}

// One managed program's outcome from an apply. `program` is the provider ID
// (for example `claude-code`, `vscode`); `detail` is at most 1024 bytes and
// carries paths, fixed reasons and error chains of the kind sent in
// `ConfigStatus.error`, which do not quote managed file content.
message ProgramStatus {
  string program = 1;
  ProgramState state = 2;
  string detail = 3;
}

enum ProgramState {
  PROGRAM_STATE_UNSPECIFIED = 0;
  PROGRAM_STATE_APPLIED = 1;
  PROGRAM_STATE_UNCHANGED = 2;
  PROGRAM_STATE_REMOVED = 3;
  PROGRAM_STATE_CONFLICT = 4;
  PROGRAM_STATE_INACTIVE = 5;
  PROGRAM_STATE_BLOCKED = 6;
  PROGRAM_STATE_FAILED = 7;
  // The program is configured, but the device user opted out of it (the
  // policy's `programSelection.allowUserChoice` permits this); its managed
  // content is removed. An older controller reads this as unspecified.
  PROGRAM_STATE_OPTED_OUT = 8;
}
