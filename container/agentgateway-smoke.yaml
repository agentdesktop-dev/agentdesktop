# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  readinessAddr: 0.0.0.0:15021

binds:
- port: 15008
  tunnelProtocol: connect
  listeners:
  - name: local-connect
    protocol: HTTP
    routes: []
- port: 4000
  mode: internal
  listeners:
  - name: smoke
    protocol: HTTP
    routes:
    - name: claude-smoke
      matches:
      - path:
          pathPrefix: /v1/messages
      policies:
        authorization:
          rules:
          - 'source.connectHeaders["x-agentdesktop-token"] == "${AGENTDESKTOP_CAPTURE_TOKEN}"'
        directResponse:
          status: 200
          body: '{"id":"msg_smoke","type":"message","role":"assistant","content":[{"type":"text","text":"hello through Agent Desktop"}],"model":"smoke","stop_reason":"end_turn","stop_sequence":null,"usage":{"input_tokens":1,"output_tokens":5}}'
- port: 443
  mode: internal
  listeners:
  - name: captured-https
    protocol: HTTPS
    tls:
      mode: dynamicCa
      cert: __AGENTDESKTOP_INSPECTION_CA_CERT__
      key: __AGENTDESKTOP_INSPECTION_CA_KEY__
    routes:
    - name: dynamic-forward
      policies:
        authorization:
          rules:
          - 'source.connectHeaders["x-agentdesktop-token"] == "${AGENTDESKTOP_CAPTURE_TOKEN}"'
        backendTLS: {}
      backends:
      - dynamic: {}
