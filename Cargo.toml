[workspace]
resolver = "2"
members = [
    "crates/agent",
    "crates/cli",
    "crates/client",
    "crates/controller",
    "crates/core",
    "crates/proto",
    "ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
agentplane-agent = { path = "crates/agent" }
agentplane-client = { path = "crates/client" }
agentplane-core = { path = "crates/core" }
agentplane-proto = { path = "crates/proto" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
http-body-util = "0.1"
humantime-serde = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
jsonwebtoken = { version = "10.4", features = ["aws_lc_rs"] }
open = "5.4"
prost = "0.14"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path_to_error = "0.1"
serde-transcode = "1.1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["any", "macros", "migrate", "postgres", "runtime-tokio", "sqlite", "tls-rustls-ring-webpki"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
