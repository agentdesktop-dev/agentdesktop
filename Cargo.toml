[package]
name = "agentdesktop"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/agentdesktop-dev/agentdesktop"
default-run = "agentdesktop"
build = "build.rs"

[features]
embedded-installer = []

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.4"
futures-util = "0.3"
h2 = "0.4"
http = "1"
keyring = { version = "4.1.5", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }
oauth2 = { version = "5.0.0", default-features = false }
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
open = "5.4.0"
p256 = { version = "0.14.0", features = ["pkcs8"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "http2", "json", "rustls", "stream"] }
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
rustix = { version = "1", features = ["fs", "net", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["json"] }
url = "2.5"
zstd = "0.13"
tempfile = "3"
rcgen = { version = "0.14.5", default-features = false, features = ["crypto", "pem", "ring", "x509-parser", "zeroize"] }
x509-parser = "0.18.1"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.7"
netlink-packet-sock-diag = "0.4.2"
netlink-sys = "0.8.8"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_System_Threading"] }

[build-dependencies]
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
http-body-util = "0.1"
tokio-stream = "0.1"

