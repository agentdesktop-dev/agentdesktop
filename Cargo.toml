[package]
name = "agentgateway-edge-connector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "stream"] }
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
url = "2.5"

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tokio-stream = "0.1"

