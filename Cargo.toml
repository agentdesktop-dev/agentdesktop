[package]
name = "agentplane"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["ui/src-tauri"]
resolver = "2"

[dependencies]
agent-core = { path = "../agentgateway/crates/core" }
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal"] }
