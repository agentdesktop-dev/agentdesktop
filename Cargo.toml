[workspace]
resolver = "2"
members = [
    "crates/agent",
    "crates/client",
    "crates/controller",
    "crates/core",
    "crates/proto",
    "crates/xtask",
    "crates/agentdesktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
agentdesktop-agent = { path = "crates/agent" }
agentdesktop-client = { path = "crates/client" }
agentdesktop-core = { path = "crates/core" }
agentdesktop-proto = { path = "crates/proto" }
anyhow = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
aws-lc-rs = "1.18"
axum = "0.8"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
http-body-util = "0.1"
humantime-serde = "1"
hostname = "0.4"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
memchr = "2.8"
notify = "8.2"
notify-debouncer-full = "0.7"
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
json5 = "1.3"
keyring = "4.1"
keyring-core = "1"
libc = "0.2"
open = "5.4"
pem-rfc7468 = { version = "1", features = ["alloc"] }
prost = "0.14"
protox = "0.9"
rand = "0.10"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
reqwest = { version = "0.13", default-features = false, features = ["charset", "form", "http2", "json", "rustls"] }
schemars = "=1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path_to_error = "0.1"
serde-transcode = "1.1"
serde_yaml = "0.9"
sha2 = "0.11"
similar = "3.1"
sqlx = { version = "0.9", default-features = false, features = ["any", "macros", "migrate", "postgres", "runtime-tokio", "sqlite", "tls-rustls-aws-lc-rs"] }
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport", "tls-aws-lc"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "1.1"
time = "0.3"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18"
